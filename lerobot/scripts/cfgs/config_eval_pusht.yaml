# old_experiment_dir: ./exp_local/${suite.name}_${obs_type}/${task_name}/${name_of_expert_demo}_valgroups_${val_num_groups}/${old_feature_type}/${seed}/${agent.name}/${wandb_run_id}
experiment_dir: ./exp_local/${suite.name}_${obs_type}/${task_name}/${wandb_run_id}
# final_experiment_dir: ${experiment_dir}/${oc.generate_run_id:}
final_experiment_dir: ${eval_cfg.output_dir}
# ${now:%H%M%S}

eval:
  n_episodes: 1
  # `batch_size` specifies the number of environments to use in a gym.vector.VectorEnv.
  batch_size: 1
  # `use_async_envs` specifies whether to use asynchronous environments (multiprocessing).
  use_async_envs: false

hydra:
  run:
    dir: ${final_experiment_dir}
  sweep:
    dir: ${final_experiment_dir}
    subdir: ${hydra.job.num}
  launcher:
    tasks_per_node: 1
    nodes: 1
    submitit_folder: ${final_experiment_dir}/.slurm
  job:
    chdir: true # change to run dir (so that tfrecords are stored in the experiment dir and not in codebase)